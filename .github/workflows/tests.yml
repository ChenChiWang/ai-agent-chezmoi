name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          sh .github/ci/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: sh .github/ci/run-tests.sh

  # 原生 Windows 不跑引擎，只驗證跟隨模式（setup/windows-follow.ps1）；以 Windows PowerShell 5.1 執行
  windows-follow:
    name: windows-2025 (native follower)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows follower end-to-end
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\ci\test-windows-follow.ps1

  # 原生 Windows 的引擎端對端（#15 W6）：experimental，先允許失敗；穩定後由維護者改為必過。
  # 用 runner 內建的 Python；chezmoi 與 Gitleaks 以固定版本與 SHA-256 安裝到 ~/.local/bin。
  windows-engine:
    name: windows-2025 (native engine, experimental)
    runs-on: windows-2025
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\ci\install-windows-tools.ps1
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Native engine end-to-end
        shell: powershell
        run: python .github\ci\test-windows-engine.py

  wsl:
    name: windows-2025 (WSL2 Ubuntu 24.04)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: ca-certificates curl python3 software-properties-common
      # Ubuntu 24.04 內建 Git 2.43，引擎需要 2.45 以上；測試以一般使用者執行，不用 root。
      - name: Upgrade Git and create a non-root user
        shell: wsl-bash {0}
        run: |
          set -eu
          add-apt-repository -y ppa:git-core/ppa
          apt-get update -q
          apt-get install -y -q git
          useradd -m -s /bin/bash ci
      # 工作目錄在 Windows 磁碟（/mnt/d）上，chmod 無效；把 commit 的內容匯出到 ext4 再測。
      - name: Export the checkout onto ext4
        shell: wsl-bash {0}
        run: |
          set -eu
          src=$(wslpath -u '${{ github.workspace }}')
          install -d -o ci -g ci /home/ci/repo
          git -c safe.directory='*' -C "$src" archive --format=tar HEAD | tar -x -C /home/ci/repo
          chown -R ci:ci /home/ci/repo
      # su - 經過 pam_umask，同名主要群組的使用者會拿到 umask 002：這個 job 刻意在 002 下測試，
      # ubuntu/macOS job 則是 022，兩種 umask 都有覆蓋。
      - name: Install pinned tools and run tests
        shell: wsl-bash {0}
        run: |
          su - ci -c 'echo "umask $(umask)" && cd ~/repo && sh .github/ci/install-tools.sh && PATH="$HOME/.local/bin:$PATH" sh .github/ci/run-tests.sh'
